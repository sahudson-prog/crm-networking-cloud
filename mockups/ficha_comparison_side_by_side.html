<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparacion ficha contacto</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #eef2f7;
      color: #1f2937;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .bar {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      border-bottom: 1px solid #d9dee8;
      background: #ffffff;
      font-size: 13px;
      font-weight: 750;
    }
    .tag {
      border: 1px solid #d9dee8;
      border-radius: 999px;
      padding: 4px 9px;
      color: #64748b;
      background: #f8fafc;
      font-size: 11px;
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px;
      height: calc(100vh - 44px);
    }
    .pane {
      min-width: 0;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
    }
    .pane-title {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      border-bottom: 1px solid #e5e7eb;
      background: #fbfcfe;
      color: #334155;
      font-size: 12px;
      font-weight: 800;
    }
    iframe {
      display: block;
      width: 100%;
      height: calc(100% - 34px);
      border: 0;
      background: #f6f7fb;
    }
  </style>
</head>
<body>
  <div class="bar">
    <span>Ficha Ricardo Smith</span>
    <span class="tag">Real vs maqueta</span>
  </div>
  <main class="grid">
    <section class="pane">
      <div class="pane-title">App real</div>
      <iframe src="http://localhost:8501/?view=contacto&google_id=people%2Fc690455098905918125"></iframe>
    </section>
    <section class="pane">
      <div class="pane-title">Maqueta aprobada</div>
      <iframe src="http://localhost:8511/contacto_ficha_acciones_mockup.html"></iframe>
    </section>
  </main>
</body>
</html>
